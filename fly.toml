# fly.toml app configuration file generated for yusri-wajibot on 2026-10-25T09:51:29+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'yusri-wajibot'
primary_region = 'sin'

[build]
[env]
  DB_PATH = '/data/wajibot.db'
  GOAL_DEADLINE = '2026-11-13'
  GOAL_KM = '30'
  GOAL_PUSHUPS = '10'
  TIMEZONE = 'Asia/Kuala_Lumpur'

[[mounts]]
  source = 'wajibotdata'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
